# Builds CapyIsland for iPhone and uploads it to TestFlight — no Mac needed.
#
#   1. Unity (on a Linux runner, via GameCI) exports the Xcode project.
#   2. Xcode (on a GitHub macOS runner) compiles it, signs it with Apple's
#      cloud-managed certificate, and uploads it to App Store Connect.
#
# Run it from GitHub: Actions tab → "iOS → TestFlight" → Run workflow.
# Setup (Apple account, API key, Unity license, secrets): docs/IOS_BUILD.md

name: iOS → TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  unity:
    name: Unity → Xcode project
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The Unity iOS image is large; clear room on the runner first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          tool-cache: false
          swap-storage: false

      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Build Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildName: CapyIsland
          versioning: None # keep the version from Player Settings (1.0)

      # tar keeps the executable bits on Unity's Xcode build scripts,
      # which upload-artifact would otherwise strip.
      - name: Pack Xcode project
        run: sudo tar -czf xcode-project.tgz -C build/iOS CapyIsland

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tgz
          retention-days: 3

  xcode:
    name: Xcode → TestFlight
    needs: unity
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT_DIR: CapyIsland
      ARCHIVE: ${{ github.workspace }}/CapyIsland.xcarchive
      KEY_PATH: ${{ github.workspace }}/AuthKey.p8
    steps:
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Unpack Xcode project
        run: tar -xzf xcode-project.tgz

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"

      # TestFlight needs a new build number every upload; use the run number.
      - name: Set build number
        run: |
          PLIST="$PROJECT_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          # Standard encryption only (HTTPS etc.) — skips the export-compliance prompt.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      # Archive unsigned; signing happens at export with Apple's cloud-managed
      # distribution certificate, so no certificate files are ever stored.
      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT_DIR/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign and upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
