# Builds an unsigned iPhone app (.ipa) without a Mac of our own:
#   1. A Linux runner has Unity export the Xcode project (CapyIsland/Build/iOS Xcode Project).
#   2. A macOS runner compiles it with Xcode, unsigned, and packs it into CapyIsland.ipa.
# Install the .ipa with Sideloadly on Windows using a free Apple ID (re-sign every 7 days).
#
# Needs repo secrets UNITY_LICENSE (contents of Unity_lic.ulf), UNITY_EMAIL, UNITY_PASSWORD.
# Manual only: macOS minutes are expensive on a private repo. Run it from the Actions tab, or
# push a tag starting with "ios-" (e.g. `git tag ios-3 && git push origin ios-3`).

name: iOS build

on:
  workflow_dispatch:
  push:
    tags: ["ios-*"]

jobs:
  export:
    name: Export Xcode project (Unity, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space for the Unity image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      # LFS bandwidth is metered, so keep the art in the Actions cache between builds.
      - name: List LFS files
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS files
        run: |
          git lfs pull
          git add .
          git reset --hard

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-iOS-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildMethod: CapyIsland.EditorTools.BuildScripts.BuildIOS
          versioning: None

      # Tar rather than upload the folder directly: artifacts drop the executable bit, and the
      # Xcode project runs shell scripts from its build phases.
      - name: Pack Xcode project
        run: |
          proj=$(sudo find build -maxdepth 4 -name Unity-iPhone.xcodeproj -print -quit)
          if [ -z "$proj" ]; then echo "No Xcode project was exported"; exit 1; fi
          sudo tar -czf xcode.tgz -C "$(dirname "$proj")" .
          ls -lh xcode.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode.tgz
          retention-days: 3

  ipa:
    name: Compile unsigned .ipa (Xcode, macOS)
    needs: export
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
      - name: Unpack
        run: mkdir xcode && tar -xzf xcode.tgz -C xcode

      - name: Build
        working-directory: xcode
        # The full log is tens of thousands of lines; show only errors and the tail.
        run: |
          xcodebuild -version
          log="$RUNNER_TEMP/xcodebuild.log"
          if ! xcodebuild build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$log" 2>&1; then
            grep -E "error:" "$log" | head -50
            tail -40 "$log"
            exit 1
          fi
          tail -3 "$log"

      - name: Package .ipa
        run: |
          app=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then echo "No .app was built"; exit 1; fi
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry CapyIsland.ipa Payload
          ls -lh CapyIsland.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CapyIsland-ipa
          path: CapyIsland.ipa
          retention-days: 14
